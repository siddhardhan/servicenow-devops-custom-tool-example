name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Run go vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Run tests
        run: |
          cd evidence-service
          go test ./...

  build-image:
    name: Build image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build image
        run: |
          cd evidence-service
          docker build --platform linux/amd64 -t evidence-service:latest .

  publish-image:
    name: Publish image (optional)
    runs-on: ubuntu-latest
    needs: [build-image]
    if: needs.build-image.result == 'success' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ACR
        if: ${{ secrets.ACR_LOGIN_SERVER && secrets.ACR_USERNAME && secrets.ACR_PASSWORD }}
        run: |
          echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin
      - name: Tag and push
        if: ${{ secrets.ACR_LOGIN_SERVER && secrets.ACR_USERNAME && secrets.ACR_PASSWORD }}
        run: |
          cd evidence-service
          docker tag evidence-service:latest ${{ secrets.ACR_LOGIN_SERVER }}/evidence-service:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/evidence-service:latest

  deploy-staging:
    name: Deploy Staging (manual)
    runs-on: ubuntu-latest
    needs: [publish-image]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - name: Placeholder
        run: echo "Add deployment steps here; requires Azure credentials in secrets"
